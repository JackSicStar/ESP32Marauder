name: Build and Push Parallel

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:

jobs:
  compile_sketch:
    name: Build ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: "xiaos3plus"
            flag: "XIAO_ESP32_S3"
            # Używamy domyślnego PartitionScheme dla XIAO ESP32S3
            fbqn: "esp32:esp32:XIAO_ESP32S3:FlashSize=8M,PSRAM=opi"
            file_name: "xiaos3plus"
            build_dir: "esp32s3"
            idf_ver: "2.0.10"
            nimble_ver: "1.3.8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config set directories.data "$HOME/.arduino15"
          arduino-cli config set directories.user "$HOME/Arduino"

      - name: Install ESP32 Core v${{ matrix.board.idf_ver }}
        run: |
          URL="https://github.com/espressif/arduino-esp32/releases/download/${{ matrix.board.idf_ver }}/package_esp32_dev_index.json"
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@${{ matrix.board.idf_ver }} --additional-urls "$URL"

      - name: Check Board Options
        run: |
          echo "=== Sprawdzam dostępne opcje dla XIAO ESP32S3 ==="
          arduino-cli board details esp32:esp32:XIAO_ESP32S3 | grep -A 20 "Option: PartitionScheme" || true
          echo "=== Sprawdzam właściwości kompilacji ==="
          arduino-cli compile --show-properties --fqbn esp32:esp32:XIAO_ESP32S3 ./esp32_marauder 2>/dev/null | grep PartitionScheme || true

      - name: Install Required Libraries
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          
          # Lista bibliotek z poprawionymi wersjami
          declare -A libs=(
            ["AsyncTCP"]="ESP32Async/AsyncTCP,v3.4.9"
            ["ESPAsyncWebServer"]="bigbrodude6119/ESPAsyncWebServer,master"
            ["TFT_eSPI"]="Bodmer/TFT_eSPI,V2.5.34"
            ["NimBLE-Arduino"]="h2zero/NimBLE-Arduino,${{ matrix.board.nimble_ver }}"
            ["ArduinoJson"]="bblanchon/ArduinoJson,v6.18.2"
            ["LinkedList"]="ivanseidel/LinkedList,v1.3.3"
          )

          for lib_name in "${!libs[@]}"; do
            IFS=',' read -r repo ref <<< "${libs[$lib_name]}"
            echo "Installing $lib_name from $repo ($ref)"
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "temp_$lib_name"
            cp -r "temp_$lib_name" "$HOME/Arduino/libraries/$lib_name"
            rm -rf "temp_$lib_name"
          done

      - name: Configure XIAO Board in configs.h
        run: |
          CONFIG_FILE="./esp32_marauder/configs.h"
          if [ -f "$CONFIG_FILE" ]; then
            # Wyłącz inne definicje boardów
            sed -i 's/^[[:space:]]*#define[[:space:]]\+MARAUDER_MULTIBOARD_S3/\/\/&/' "$CONFIG_FILE"
            sed -i 's/^[[:space:]]*#define[[:space:]]\+MARAUDER_CARDPUTER/\/\/&/' "$CONFIG_FILE"
            
            # Włącz XIAO_ESP32_S3
            if ! grep -q '^[[:space:]]*#define[[:space:]]\+XIAO_ESP32_S3' "$CONFIG_FILE"; then
              echo "#define XIAO_ESP32_S3" >> "$CONFIG_FILE"
            fi
          fi

      - name: Compile Marauder for XIAO ESP32S3
        run: |
          export PATH=$PATH:$GITHUB_WORKSPACE/bin
          
          echo "=== Rozpoczynam kompilację ==="
          
          # Próba 1: Z domyślnym PartitionScheme
          arduino-cli compile \
            --fqbn: "esp32:esp32:dfrobot_firebeetle2_esp32e:FlashSize=16M,PartitionScheme=min_spiffs,PSRAM=enabled" \
            --build-property "compiler.cpp.extra_flags=-DXIAO_ESP32_S3 -DHEADLESS -DENABLE_FLIPPER_COMPANION -DFLIPPER_SD -DHAS_PSRAM" \
            --build-property "compiler.c.extra_flags=-DXIAO_ESP32_S3 -DHEADLESS -DENABLE_FLIPPER_COMPANION -DFLIPPER_SD -DHAS_PSRAM" \
            --warnings none \
            ./esp32_marauder
            
          echo "=== Kompilacja zakończona pomyślnie ==="

      - name: Prepare Artifact
        id: prepare_artifact
        run: |
          BUILD_DIR="./esp32_marauder/build/esp32.esp32.${{ matrix.board.build_dir }}"
          INPUT_BIN="$BUILD_DIR/esp32_marauder.ino.bin"
          OUTPUT_BIN="esp32_marauder_xiaos3plus.bin"
          
          if [ -f "$INPUT_BIN" ]; then
            cp "$INPUT_BIN" "$OUTPUT_BIN"
            echo "artifact_name=$OUTPUT_BIN" >> $GITHUB_OUTPUT
            echo "artifact_path=$OUTPUT_BIN" >> $GITHUB_OUTPUT
            echo "SUCCESS: Utworzono $OUTPUT_BIN"
          else
            echo "ERROR: Nie znaleziono pliku binarnego"
            find "./esp32_marauder/build" -name "*.bin" -type f || true
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.artifact_name }}
          path: ${{ steps.prepare_artifact.outputs.artifact_path }}
