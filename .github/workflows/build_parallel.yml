name: Build and Push Parallel

on:
  workflow_dispatch:  # Ręczne uruchomienie
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:

jobs:
  compile_sketch:
    name: Build ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: "xiaos3plus"
            flag: "XIAO_ESP32_S3"
            fbqn: "esp32:esp32:XIAO_ESP32S3:PartitionScheme=min_spiffs,FlashSize=8M,PSRAM=opi"
            file_name: "xiaos3plus"
            tft: false
            tft_file: ""
            build_dir: "esp32s3"
            addr: "0x0"
            idf_ver: "2.0.10"
            nimble_ver: "1.3.8"
            esp_async: "bigbrodude6119/ESPAsyncWebServer"
            esp_async_ver: "master"

    steps:
      # Krok 1: Pobranie kodu
      - name: Checkout Code
        uses: actions/checkout@v3

      # Krok 2: Instalacja Arduino CLI
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
          export PATH=$PATH:$GITHUB_WORKSPACE/bin
          arduino-cli version

      # Krok 3: Konfiguracja Arduino CLI
      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config set directories.data "$HOME/.arduino15"
          arduino-cli config set directories.downloads "$HOME/.arduino15/staging"
          arduino-cli config set directories.user "$HOME/Arduino"
          arduino-cli config dump

      # Krok 4: Instalacja ESP32 Core
      - name: Install ESP32 Core v${{ matrix.board.idf_ver }}
        run: |
          URL="https://github.com/espressif/arduino-esp32/releases/download/${{ matrix.board.idf_ver }}/package_esp32_dev_index.json"
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@${{ matrix.board.idf_ver }} --additional-urls "$URL"
          arduino-cli core list

      # Krok 5: Instalacja bibliotek - ulepszona wersja
      - name: Install Required Libraries
        run: |
          # Lista bibliotek do instalacji
          declare -A libs=(
            ["ESP32Ping"]="marian-craciunescu/ESP32Ping,1.6"
            ["AsyncTCP"]="ESP32Async/AsyncTCP,v3.4.9"
            ["MicroNMEA"]="stevemarple/MicroNMEA,v2.0.6"
            ["ESPAsyncWebServer"]="${{ matrix.board.esp_async }},${{ matrix.board.esp_async_ver }}"
            ["TFT_eSPI"]="Bodmer/TFT_eSPI,V2.5.34"
            ["XPT2046_Touchscreen"]="PaulStoffregen/XPT2046_Touchscreen,v1.4"
            ["lv_arduino"]="lvgl/lv_arduino,3.0.0"
            ["JPEGDecoder"]="Bodmer/JPEGDecoder,1.8.0"
            ["NimBLE-Arduino"]="h2zero/NimBLE-Arduino,${{ matrix.board.nimble_ver }}"
            ["Adafruit_NeoPixel"]="adafruit/Adafruit_NeoPixel,1.12.0"
            ["ArduinoJson"]="bblanchon/ArduinoJson,v6.18.2"
            ["LinkedList"]="ivanseidel/LinkedList,v1.3.3"
            ["EspSoftwareSerial"]="plerup/espsoftwareserial,8.1.0"
            ["Adafruit_BusIO"]="adafruit/Adafruit_BusIO,1.15.0"
            ["Adafruit_MAX1704X"]="adafruit/Adafruit_MAX1704X,1.0.2"
          )

          mkdir -p "$HOME/Arduino/libraries"
          
          for lib_name in "${!libs[@]}"; do
            IFS=',' read -r repo ref <<< "${libs[$lib_name]}"
            echo "Installing $lib_name from $repo ($ref)"
            
            # Pobierz bibliotekę
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "temp_$lib_name"
            
            # Skopiuj do katalogu bibliotek
            cp -r "temp_$lib_name" "$HOME/Arduino/libraries/$lib_name"
            rm -rf "temp_$lib_name"
          done
          
          # Lista zainstalowanych bibliotek
          echo "=== Zainstalowane biblioteki ==="
          ls -la "$HOME/Arduino/libraries/"

      # Krok 6: Konfiguracja TFT_eSPI
      - name: Configure TFT_eSPI
        run: |
          if [ -f "User_Setup_Select.h" ]; then
            cp User_Setup_Select.h "$HOME/Arduino/libraries/TFT_eSPI/"
            echo "Skopiowano User_Setup_Select.h"
          else
            echo "UWAGA: Brak User_Setup_Select.h - używana domyślna konfiguracja TFT"
          fi

      # Krok 7: Instalacja esptool
      - name: Install Esptool
        run: pip install esptool

      # Krok 8: Modyfikacja platform.txt (fix dla linkowania)
      - name: Fix Platform.txt for ESP32-S3
        run: |
          PLATFORM_FILE=$(find "$HOME/.arduino15/packages/esp32/hardware/esp32/${{ matrix.board.idf_ver }}" -name "platform.txt" | head -1)
          if [ -f "$PLATFORM_FILE" ]; then
            echo "Modyfikuję: $PLATFORM_FILE"
            sed -i 's/compiler.c.elf.libs.esp32s3=/compiler.c.elf.libs.esp32s3=-zmuldefs /' "$PLATFORM_FILE"
            echo "Sprawdzam modyfikację:"
            grep "compiler.c.elf.libs.esp32s3" "$PLATFORM_FILE"
          else
            echo "UWAGA: Nie znaleziono platform.txt"
          fi

      # Krok 9: Konfiguracja XIAO w configs.h
      - name: Configure XIAO Board in configs.h
        run: |
          CONFIG_FILE="./esp32_marauder/configs.h"
          if [ -f "$CONFIG_FILE" ]; then
            # Wyłącz inne definicje boardów
            sed -i 's/^[[:space:]]*#define[[:space:]]\+MARAUDER_MULTIBOARD_S3/\/\/&/' "$CONFIG_FILE"
            sed -i 's/^[[:space:]]*#define[[:space:]]\+MARAUDER_CARDPUTER/\/\/&/' "$CONFIG_FILE"
            
            # Włącz XIAO_ESP32_S3
            if ! grep -q '^[[:space:]]*#define[[:space:]]\+XIAO_ESP32_S3' "$CONFIG_FILE"; then
              echo "#define XIAO_ESP32_S3" >> "$CONFIG_FILE"
            fi
            
            echo "=== Konfiguracja boardów w configs.h ==="
            grep -E '^#define (XIAO_ESP32_S3|MARAUDER_)' "$CONFIG_FILE" || true
          else
            echo "ERROR: Brak pliku configs.h!"
            exit 1
          fi

      # Krok 10: Kompilacja projektu
      - name: Compile Marauder for ${{ matrix.board.name }}
        run: |
          export PATH=$PATH:$GITHUB_WORKSPACE/bin
          
          echo "=== Rozpoczynam kompilację ==="
          arduino-cli compile \
            --fqbn ${{ matrix.board.fbqn }} \
            --build-property "compiler.cpp.extra_flags=-D${{ matrix.board.flag }} -DHEADLESS -DENABLE_FLIPPER_COMPANION -DFLIPPER_SD -DHAS_PSRAM" \
            --build-property "compiler.c.extra_flags=-D${{ matrix.board.flag }} -DHEADLESS -DENABLE_FLIPPER_COMPANION -DFLIPPER_SD -DHAS_PSRAM" \
            --warnings none \
            --verbose \
            ./esp32_marauder
            
          echo "=== Kompilacja zakończona ==="

      # Krok 11: Przygotowanie artefaktu
      - name: Prepare Artifact
        id: prepare_artifact
        run: |
          VERSION=$(grep '#define MARAUDER_VERSION' ./esp32_marauder/configs.h | sed -E 's/.*"v([^"]+)"/v\1/' | tr '.' '_' || echo "unknown")
          DATE=$(date +%Y%m%d)
          BUILD_DIR="./esp32_marauder/build/esp32.esp32.${{ matrix.board.build_dir }}"
          INPUT_BIN="$BUILD_DIR/esp32_marauder.ino.bin"
          OUTPUT_BIN="esp32_marauder_${VERSION}_${DATE}_${{ matrix.board.file_name }}.bin"
          
          if [ -f "$INPUT_BIN" ]; then
            cp "$INPUT_BIN" "$OUTPUT_BIN"
            echo "artifact_name=$OUTPUT_BIN" >> $GITHUB_OUTPUT
            echo "artifact_path=$OUTPUT_BIN" >> $GITHUB_OUTPUT
            echo "SUCCESS: Utworzono $OUTPUT_BIN"
            ls -la "$OUTPUT_BIN"
          else
            echo "ERROR: Nie znaleziono pliku binarnego: $INPUT_BIN"
            echo "Szukam dostępnych plików:"
            find "./esp32_marauder/build" -name "*.bin" -type f || true
            exit 1
          fi

      # Krok 12: Upload artefaktu
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.artifact_name }}
          path: ${{ steps.prepare_artifact.outputs.artifact_path }}
          retention-days: 7

  # Zadanie tworzenia release
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [compile_sketch]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Marauder Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            artifacts/**/*.bin
          body: |
            ## ESP32 Marauder - XIAO ESP32S3 Plus
            
            **Hardware:** XIAO ESP32S3 Plus
            **Plik:** `xiaos3plus.bin`
            
            ### Ważne informacje:
            - Partition Scheme: min_spiffs
            - Flash Size: 8MB
            - PSRAM: Enabled (OPI)
            - Konfiguracja: HEADLESS + Flipper Companion
            
            ### Instalacja:
            Użyj ESPtool lub Arduino IDE do wgrania firmware.
            
            ```bash
            esptool.py write_flash 0x0 esp32_marauder_*_xiaos3plus.bin
            ```
