name: Build and Push Parallel

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ "*" ]
  pull_request:

jobs:
  compile_sketch:
    name: build ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: "xiaos3plus"
            flag: "XIAO_ESP32_S3"
            # FQBN bez opcji; opcje podamy przez --board-options
            fbqn: "esp32:esp32:XIAO_ESP32S3"
            file_name: "xiaos3plus"
            tft: false
            tft_file: ""
            build_dir: "esp32s3"
            addr: "0x1000"
            # Core z obsługą flash 16MB dla XIAO S3 Plus
            idf_ver: "3.3.2"
            nimble_ver: "1.3.8"
            esp_async: "bigbrodude6119/ESPAsyncWebServer"
            esp_async_ver: "master"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Arduino CLI (pinned)
        run: |
          set -eux
          VER="0.35.3"
          ARCH="Linux_64bit"
          TAR="arduino-cli_${VER}_${ARCH}.tar.gz"
          URL="https://github.com/arduino/arduino-cli/releases/download/v${VER}/${TAR}"
          curl -fsSL "$URL" -o "/tmp/$TAR"
          tar -xzf "/tmp/$TAR" -C /tmp

          if [ -f "/tmp/arduino-cli" ]; then
            sudo mv "/tmp/arduino-cli" /usr/local/bin/arduino-cli
          elif [ -f "/tmp/arduino-cli_${VER}_${ARCH}/arduino-cli" ]; then
            sudo mv "/tmp/arduino-cli_${VER}_${ARCH}/arduino-cli" /usr/local/bin/arduino-cli
          else
            BIN=$(find /tmp -maxdepth 2 -type f -name 'arduino-cli' -print -quit)
            [ -n "$BIN" ] && sudo mv "$BIN" /usr/local/bin/arduino-cli || { echo "arduino-cli not found"; exit 1; }
          fi
          sudo chmod +x /usr/local/bin/arduino-cli
          arduino-cli version

      - name: Init arduino-cli config and paths
        run: |
          set -eux
          arduino-cli config init
          arduino-cli config set directories.data "$HOME/.arduino15"
          arduino-cli config set directories.downloads "$HOME/.arduino15/staging"
          arduino-cli config set directories.user "$HOME/Arduino"
          arduino-cli config dump

      - name: Install ESP32 Core ${{ matrix.board.idf_ver }}
        run: |
          set -eux
          URL="https://github.com/espressif/arduino-esp32/releases/download/${{ matrix.board.idf_ver }}/package_esp32_dev_index.json"
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@${{ matrix.board.idf_ver }} --additional-urls "$URL"
          arduino-cli core list

      - name: Show Arduino dir structure
        run: |
          find /home/runner/.arduino15/packages/esp32/hardware/ -maxdepth 3 -type d -print || true

      # ==== Biblioteki wymagane przez Maraudera (headless – bez TFT) ====
      - name: Install ESP32Ping
        uses: actions/checkout@v2
        with:
          repository: marian-craciunescu/ESP32Ping
          ref: 1.6
          path: CustomESP32Ping

      - name: Install AsyncTCP
        uses: actions/checkout@v2
        with:
          repository: ESP32Async/AsyncTCP
          ref: v3.4.8
          path: CustomAsyncTCP

      - name: Install MicroNMEA
        uses: actions/checkout@v2
        with:
          repository: stevemarple/MicroNMEA
          ref: v2.0.6
          path: CustomMicroNMEA

      - name: Install ESPAsyncWebServer
        uses: actions/checkout@v2
        with:
          repository: ESP32Async/ESPAsyncWebServer
          ref: v3.8.1
          path: CustomESPAsyncWebServer

      - name: Install NimBLE-Arduino
        uses: actions/checkout@v2
        with:
          repository: h2zero/NimBLE-Arduino
          ref: ${{ matrix.board.nimble_ver }}
          path: CustomNimBLE-Arduino

      - name: Install Adafruit_NeoPixel
        uses: actions/checkout@v2
        with:
          repository: adafruit/Adafruit_NeoPixel
          ref: 1.12.0
          path: CustomAdafruit_NeoPixel

      - name: Install ArduinoJson
        uses: actions/checkout@v2
        with:
          repository: bblanchon/ArduinoJson
          ref: v6.18.2
          path: CustomArduinoJson

      - name: Install LinkedList
        uses: actions/checkout@v2
        with:
          repository: ivanseidel/LinkedList
          ref: v1.3.3
          path: CustomLinkedList

      - name: Install EspSoftwareSerial
        uses: actions/checkout@v2
        with:
          repository: plerup/espsoftwareserial
          ref: 8.1.0
          path: CustomEspSoftwareSerial

      - name: Install Adafruit_BusIO
        uses: actions/checkout@v2
        with:
          repository: adafruit/Adafruit_BusIO
          ref: 1.15.0
          path: CustomAdafruit_BusIO

      - name: Install Adafruit_MAX1704X
        uses: actions/checkout@v2
        with:
          repository: adafruit/Adafruit_MAX1704X
          ref: 1.0.2
          path: CustomAdafruit_MAX1704X

      - name: Stage Arduino libraries (strip Custom* -> official names)
        run: |
          set -eux
          mkdir -p "$HOME/Arduino/libraries"
          shopt -s nullglob
          for d in Custom*; do
            [ -d "$d" ] || continue
            base="${d#Custom}"
            [ "$d" = "CustomNimBLE-Arduino" ] && base="NimBLE-Arduino"
            rm -rf "$HOME/Arduino/libraries/$base"
            cp -a "$d" "$HOME/Arduino/libraries/$base"
          done
          echo "==== libraries staged ===="
          find "$HOME/Arduino/libraries" -maxdepth 1 -mindepth 1 -type d -printf "%f\n" | sort
          echo "==== arduino-cli lib list ===="
          arduino-cli lib list || true

      - name: Force XIAO target in configs.h (headless + Flipper)
        run: |
          set -eux
          CFG=./esp32_marauder/configs.h
          sed -i 's/^[[:space:]]*#define[[:space:]]\+MARAUDER_MULTIBOARD_S3/\/\/&/' "$CFG" || true
          sed -i 's/^[[:space:]]*#define[[:space:]]\+MARAUDER_CARDPUTER/\/\/&/' "$CFG" || true
          if ! grep -q '^[[:space:]]*#define[[:space:]]\+XIAO_ESP32_S3' "$CFG"; then
            sed -i '1i#define XIAO_ESP32_S3' "$CFG"
          fi
          echo "Board lines in configs.h:"
          grep -nE '^#define (XIAO_ESP32_S3|MARAUDER_)' "$CFG" || true

      - name: Install Esptool
        run: pip install esptool

      - name: Compile (manual arduino-cli, with 16MB fallback)
        run: |
          set -euxo pipefail
          PKG_URL="https://github.com/espressif/arduino-esp32/releases/download/${{ matrix.board.idf_ver }}/package_esp32_dev_index.json"

          echo "== arduino-cli version ==" && arduino-cli version
          echo "== libs ==" && arduino-cli lib list || true

          echo "== FIRST TRY: FlashSize=16MB =="
          LOG=/tmp/compile_16mb.log
          set +e
          arduino-cli compile \
            --fqbn "${{ matrix.board.fbqn }}" \
            --board-options "FlashSize=16MB,PSRAM=opi" \
            --additional-urls "$PKG_URL" \
            --warnings none \
            --build-property "compiler.cpp.extra_flags=-D${{ matrix.board.flag }} -DHEADLESS -DENABLE_FLIPPER_COMPANION -DFLIPPER_SD -DHAS_PSRAM" \
            --build-property "compiler.c.extra_flags=-D${{ matrix.board.flag }} -DHEADLESS -DENABLE_FLIPPER_COMPANION -DFLIPPER_SD -DHAS_PSRAM" \
            ./esp32_marauder -v |& tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -ne 0 ] && grep -qi "invalid value.*FlashSize" "$LOG"; then
            echo "== RETRY: FlashSize=16MB (core nie przyjął 16MB) =="
            arduino-cli compile \
              --fqbn "${{ matrix.board.fbqn }}" \
              --board-options "FlashSize=16MB,PSRAM=opi" \
              --additional-urls "$PKG_URL" \
              --warnings none \
              --build-property "compiler.cpp.extra_flags=-D${{ matrix.board.flag }} -DHEADLESS -DENABLE_FLIPPER_COMPANION -DFLIPPER_SD -DHAS_PSRAM" \
              --build-property "compiler.c.extra_flags=-D${{ matrix.board.flag }} -DHEADLESS -DENABLE_FLIPPER_COMPANION -DFLIPPER_SD -DHAS_PSRAM" \
              ./esp32_marauder -v
          elif [ $RC -ne 0 ]; then
            echo "Kompilacja nieudana z innym błędem, patrz log powyżej."
            exit $RC
          fi

      - name: Rename and Upload ${{ matrix.board.name }} Artifact
        run: |
          set -eux
          VERSION=$(grep '#define MARAUDER_VERSION' ./esp32_marauder/configs.h | sed -E 's/.*"v([^"]+)"/v\1/' | tr '.' '_')
          DATE=$(date +%Y%m%d)
          BUILD_DIR=./esp32_marauder/build/esp32.esp32.${{ matrix.board.build_dir }}
          INPUT_BIN="$BUILD_DIR/esp32_marauder.ino.bin"
          OUTPUT_BIN="esp32_marauder_${VERSION}_${DATE}_${{ matrix.board.file_name }}.bin"
          if [ -f "$INPUT_BIN" ]; then
            mv "$INPUT_BIN" "$BUILD_DIR/$OUTPUT_BIN"
            echo "artifact_name=$OUTPUT_BIN" >> $GITHUB_ENV
            echo "artifact_path=$BUILD_DIR/$OUTPUT_BIN" >> $GITHUB_ENV
          else
            echo "ERROR: expected build output $INPUT_BIN not found"
            ls -la "$BUILD_DIR" || true
            exit 1
          fi

      - name: Upload ${{ matrix.board.name }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_path }}
          retention-days: 5

  post_compile_steps:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [compile_sketch]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Marauder Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            esp32_marauder_v*.bin
          body: |
            **Flipper Zero Marauder Companion App:** zainstaluj najnowszą wersję, aby korzystać z trybu headless (pliki/HTML z karty Flippera).
            | Hardware              | Binary Version   |
            | --------------------- | ---------------- |
            | XIAO_ESP32S3 **Plus** | `xiaos3plus.bin` |
