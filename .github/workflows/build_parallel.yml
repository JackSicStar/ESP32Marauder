name: Build and Push Parallel
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ "*" ]
  pull_request:
jobs:
  compile_sketch:
    name: build ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: "xiaos3plus"
            flag: "XIAO_ESP32_S3"
            fbqn: "esp32:esp32:XIAO_ESP32S3"
            file_name: "xiaos3plus"
            build_dir: "esp32s3"
            addr: "0x0"
            idf_ver: "3.3.1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Install Arduino CLI (pinned)
        run: |
          set -eux
          VER="0.35.3"
          ARCH="Linux_64bit"
          TAR="arduino-cli_${VER}_${ARCH}.tar.gz"
          URL="https://github.com/arduino/arduino-cli/releases/download/v${VER}/${TAR}"
          curl -fsSL "$URL" -o "/tmp/$TAR"
          tar -xzf "/tmp/$TAR" -C /tmp
          if [ -f "/tmp/arduino-cli" ]; then
            sudo mv "/tmp/arduino-cli" /usr/local/bin/arduino-cli
          elif [ -f "/tmp/arduino-cli_${VER}_${ARCH}/arduino-cli" ]; then
            sudo mv "/tmp/arduino-cli_${VER}_${ARCH}/arduino-cli" /usr/local/bin/arduino-cli
          else
            BIN=$(find /tmp -maxdepth 2 -type f -name 'arduino-cli' -print -quit)
            [ -n "$BIN" ] && sudo mv "$BIN" /usr/local/bin/arduino-cli || { echo "arduino-cli not found"; exit 1; }
          fi
          sudo chmod +x /usr/local/bin/arduino-cli
          arduino-cli version
      - name: Init arduino-cli config and paths
        run: |
          set -eux
          arduino-cli config init
          arduino-cli config set directories.data "$HOME/.arduino15"
          arduino-cli config set directories.downloads "$HOME/.arduino15/staging"
          arduino-cli config set directories.user "$HOME/Arduino"
          arduino-cli config dump
      - name: Install ESP32 Core ${{ matrix.board.idf_ver }}
        run: |
          set -eux
          URL="https://github.com/espressif/arduino-esp32/releases/download/${{ matrix.board.idf_ver }}/package_esp32_dev_index.json"
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@${{ matrix.board.idf_ver }} --additional-urls "$URL"
          arduino-cli core list
      # ==== Stage lokalne biblioteki z repozytorium ====
      - name: Debug: List local libraries in repo
        run: |
          set -eux
          echo "==== Local libraries in ./libraries ===="
          ls -la ./libraries || echo "No ./libraries folder found!"
          find ./libraries -type d -maxdepth 1 -mindepth 1 || true
      - name: Stage Arduino libraries (use local libraries from repo)
        run: |
          set -eux
          mkdir -p "$HOME/Arduino/libraries"
          shopt -s nullglob
          for d in ./libraries/*; do
            [ -d "$d" ] || continue
            base=$(basename "$
